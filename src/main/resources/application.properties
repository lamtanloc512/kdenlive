# ---------------------------------------------------------------------------
# stdio transport: stdout carries MCP JSON-RPC only. Everything else -> stderr + file.
# ---------------------------------------------------------------------------
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] %s%e%n
quarkus.log.file.enabled=true
quarkus.log.file.path=${user.home}/.kdenlive-mcp/logs/kdenlive-mcp.log
quarkus.log.file.rotation.max-file-size=5M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.category."dev.kdenlivemcp".level=DEBUG
quarkus.log.category."dev.kdenlivemcp".min-level=DEBUG
# Any stray System.out.println is swallowed instead of corrupting the protocol (default true).
quarkus.mcp.server.stdio.null-system-out=true

quarkus.mcp.server.server-info.name=kdenlive-mcp
quarkus.mcp.server.server-info.version=${quarkus.application.version}

# ---------------------------------------------------------------------------
# External binaries. Leave empty to auto-detect (kdenlive.app bundle, Homebrew, PATH).
# Env vars MELT_PATH / FFPROBE_PATH / FFMPEG_PATH / WORK_DIR override.
# ---------------------------------------------------------------------------
kdenlive.melt-path=${MELT_PATH:}
kdenlive.ffprobe-path=${FFPROBE_PATH:}
kdenlive.ffmpeg-path=${FFMPEG_PATH:}
kdenlive.work-dir=${WORK_DIR:${user.home}/.kdenlive-mcp/work}
kdenlive.log-dir=${user.home}/.kdenlive-mcp/logs
# Timeouts (seconds)
kdenlive.probe-timeout=30
kdenlive.frame-timeout=30
kdenlive.render-min-timeout=600
kdenlive.render-timeout-factor=5
kdenlive.undo-depth=200

# Tests write logs to the build dir instead of the home dir.
%test.quarkus.log.file.path=target/test-logs/kdenlive-mcp.log
%test.kdenlive.work-dir=target/test-work
%test.kdenlive.log-dir=target/test-logs
# Surefire talks to forked test JVMs over stdin: never let the MCP stdio transport read it in tests.
%test.quarkus.mcp.server.stdio.enabled=false
